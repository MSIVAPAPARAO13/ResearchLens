services:
  reverse-proxy:
    image: nginx:alpine
    container_name: researchlens-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - researchlens
      - mlflow
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  researchlens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchlens-app
    # Unexposed to public host; bound to internal docker network and loopback
    expose:
      - "8501"
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - RESEARCHLENS_ENV=production
      - RESEARCHLENS_DEBUG=false
      - RESEARCHLENS_DEVICE=cpu
      - RESEARCHLENS_LOG_LEVEL=INFO
      - RESEARCHLENS_LOG_FORMAT=json
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_ENABLED=true
      - RESEARCHLENS_WORKSPACES_DIR=/app/data/workspaces
    volumes:
      - researchlens_workspaces:/app/data/workspaces
      - researchlens_runs:/app/runs
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: researchlens-mlflow
    # Internal only; never published to public 0.0.0.0
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  researchlens_workspaces:
    name: researchlens_workspaces
  researchlens_runs:
    name: researchlens_runs
  mlflow_data:
    name: mlflow_data
