# Nginx Reverse Proxy Configuration for ResearchLens (Phase 16.2)
# Handles TLS termination, security headers, rate limiting, and access control.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Maximum payload size (100MB for large multi-paper research PDFs)
    client_max_body_size 100M;

    # Rate limiting zone (50 requests/sec per IP)
    limit_req_zone $binary_remote_addr zone=global_rate:10m rate=50r/s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream application services
    upstream researchlens_backend {
        server researchlens:8501;
    }

    upstream mlflow_backend {
        server mlflow:5000;
    }

    # -------------------------------------------------------------------------
    # HTTP Server: Redirect all plaintext HTTP traffic to HTTPS (Port 443)
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge for automated Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS Server: TLS Termination & Security Enforcement
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # TLS Certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Modern TLS Security Controls
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Hardened HTTP Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Health Check Proxy (for cloud load balancers and orchestrators)
        location /health {
            proxy_pass http://researchlens_backend/_stcore/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Robots.txt — Explicitly shields internal routes, MLflow, and private workspaces from web spiders
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nAllow: /$\nDisallow: /_stcore/\nDisallow: /mlflow/\nDisallow: /api/\nDisallow: /workspace/\nDisallow: /experiments/\nDisallow: /data/\nSitemap: https://researchlens.ai/sitemap.xml\n";
        }

        # Sitemap.xml — Canonical public discovery endpoint
        location = /sitemap.xml {
            default_type application/xml;
            return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n  <url>\n    <loc>https://researchlens.ai/</loc>\n    <changefreq>weekly</changefreq>\n    <priority>1.0</priority>\n  </url>\n</urlset>\n";
        }

        # Streamlit Application (Root) with Full WebSocket Upgrade
        location / {
            limit_req zone=global_rate burst=100 nodelay;

            proxy_pass http://researchlens_backend;
            proxy_http_version 1.1;

            # Streamlit WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Restricted MLflow Tracking & Dashboard Interface
        location /mlflow/ {
            auth_basic "ResearchLens MLflow Restricted Area";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # Ensure MLflow is NEVER indexed by web crawlers
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

            proxy_pass http://mlflow_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
