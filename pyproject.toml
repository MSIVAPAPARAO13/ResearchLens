[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchlens"
version = "0.1.0"
description = "AI-Powered Research Paper Summarization & Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ResearchLens Contributors" }
]
keywords = ["nlp", "summarization", "research-papers", "transformers", "bart", "information-extraction"]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "spacy>=3.8.0",
    "nltk>=3.9.0",
    "pymupdf>=1.24.0",
    "rouge-score>=0.1.2",
    "streamlit>=1.40.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
